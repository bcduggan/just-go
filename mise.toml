[tools]
hk = "latest"
pkl = "latest"
jq = "latest"

[env]
HK_MISE = 1

[hooks]
# Automatically install/update hooks when tools are installed
postinstall = "hk install --mise"

[tasks.pkl-download-packages]
# pkl-lsp automatically downloads imports through an LSP extension that some editors, like VSCode, can use.
# Some editors, like Helix, don't support that extension. However, they can use cached imports if they have been
# manually downloaded.
description = "Manually download packages for pkl files."
usage = '''
  arg "<pkl-files>" help="pkl files" var=#true var_min=1
'''
run = [
  '''
  pkl analyze imports --format json "{{ usage.pkl_files|unique|join(sep='" "') }}" \
    | jq --raw-output '.imports | keys | .[]' \
    | grep --regexp '^package://' \
    | cut --fields 1 --delimiter '#' \
    | uniq \
    | xargs pkl download-package
  ''',
]
